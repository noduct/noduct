name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        id: configure-pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify configured Pages origin
        shell: bash
        env:
          CONFIGURED_URL: ${{ steps.configure-pages.outputs.base_url }}
        run: |
          expected_url="$(npx tsx scripts/expected-pages-url.ts)"
          configured_url="${CONFIGURED_URL%/}"
          if [ "$configured_url" != "$expected_url" ]; then
            echo "GitHub Pages base_url mismatch: configured=$configured_url expected=$expected_url" >&2
            exit 1
          fi
      - run: npm run verify
      - name: Verify GitHub Pages entry routes
        shell: bash
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/pt-br/index.html
          test -f dist-pages/es/index.html
          test -f dist-pages/data/sponsorships.json
          npx tsx scripts/check-deployed-tools.ts dist-pages
          test -f dist-pages/noduct/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-pages }
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Confirm hosting compliance before enabling this workflow
        run: echo "Commercial mode must remain prelaunch until GitHub Pages policy review is complete."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published entry routes
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL%/}/pt-br/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL%/}/data/sponsorships.json"
          npx tsx scripts/check-deployed-tools.ts "${PAGES_URL%/}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL%/}/robots.txt"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL%/}/noduct/"
