name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run validate
      - name: Verify GitHub Pages entry routes
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/pt-br/index.html
          test -f dist/es/index.html
          test -f dist/data/sponsorships.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Confirm hosting compliance before enabling this workflow
        run: echo "Commercial mode must remain prelaunch until GitHub Pages policy review is complete."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published entry routes
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL}"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL%/}/pt-br/"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors --output /dev/null "${PAGES_URL%/}/data/sponsorships.json"
