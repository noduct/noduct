name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Guardrail ratchet against PR base
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/check-guardrail-ratchet.ts --base "${{ github.event.pull_request.base.sha }}"
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run validate:ui
      - run: npm run validate:architecture
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:catalog
      - run: npm run check:sponsors
      - run: npm run build:pages
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - run: npm run test:lighthouse
