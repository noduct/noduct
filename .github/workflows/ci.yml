name: CI
on:
  push:
    branches: [main, 'epic/**']
  pull_request:
    branches: [main, 'epic/**']
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  issues: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm run check -- pages
      - run: npm run check -- seo
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - run: npx lhci autorun
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate and review sample tool
        shell: bash
        run: |
          if npm run new:tool -- ci-sample-tool --category text-tools; then
            echo "The generated translation placeholders must fail check" >&2
            exit 1
          fi
          test -f packages/ci-sample-tool/src/config.ts
          sed -i 's/TODO(i18n)/Sample/g' packages/ci-sample-tool/src/i18n.ts src/data/tools.json src/i18n/catalog/pt-BR.json src/i18n/catalog/es.json
      - run: npm run build -- ci-sample-tool
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.dev.config.ts
        env:
          NODUCT_DEV_SLUG: ci-sample-tool
      - run: npm run verify
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
